services:
  egress:
    image: rakazo/egress:local
    build:
      context: .
      dockerfile: infra/boat/Dockerfile
    container_name: rakazo-egress
    restart: unless-stopped
    environment:
      BOAT_ENVIRONMENT: ${BOAT_ENVIRONMENT:-rakazo}
      BOAT_ENVIRONMENT_ID: ${BOAT_ENVIRONMENT_ID:?Set BOAT_ENVIRONMENT_ID}
      BOAT_WIREGUARD_ENDPOINT: ${BOAT_WIREGUARD_ENDPOINT:?Set BOAT_WIREGUARD_ENDPOINT}
      RAKAZO_NETWORK_CONFIG: /config/network.json
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - network-control:/control
      - network-runtime:/network-runtime
      - ./infra/boat:/deployment:ro
      - ./boat-network/state:/state
      - ${RAKAZO_NETWORK_CONFIG_DIR:?Set RAKAZO_NETWORK_CONFIG_DIR}:/config:ro
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    dns: [1.1.1.1, 1.0.0.1]
    ports:
      - "127.0.0.1:3100:3100"
      - "127.0.0.1:5173:5173"
      - "${BOAT_BIND_IP:-0.0.0.0}:51871:51871/udp"
    networks:
      app:
        aliases: [api, web, supervisor]
      data: {}
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "5", --unix-socket, /control/network.sock, "http://network-control/health"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 12
  api:
    environment:
      RAKAZO_NETWORK_CONFIG: /config/network.json
      RAKAZO_NETWORK_ACTIVE_CONFIG: /network-runtime/active.json
      RAKAZO_NETWORK_CONTROL_SOCKET: /network-control/network.sock
    volumes:
      - network-runtime:/network-runtime:ro
      - network-control:/network-control:ro
      - ${RAKAZO_NETWORK_CONFIG_DIR:?Set RAKAZO_NETWORK_CONFIG_DIR}:/config:rw
    network_mode: service:egress
    networks: !reset []
    ports: !reset []
    depends_on:
      egress:
        condition: service_healthy
  worker:
    mem_limit: 16g
    environment:
      GRAPHILE_WORKER_CONCURRENCY: "128"
      DB_POOL_MAX: "16"
      NODE_OPTIONS: --max-old-space-size=12288
      RAKAZO_NETWORK_CONFIG: /config/network.json
      RAKAZO_NETWORK_ACTIVE_CONFIG: /network-runtime/active.json
    volumes:
      - network-runtime:/network-runtime:ro
      - ${RAKAZO_NETWORK_CONFIG_DIR:?Set RAKAZO_NETWORK_CONFIG_DIR}:/config:ro
    network_mode: service:egress
    networks: !reset []
    depends_on:
      egress:
        condition: service_healthy
  web:
    network_mode: service:egress
    networks: !reset []
    ports: !reset []
    depends_on:
      egress:
        condition: service_healthy
  supervisor:
    network_mode: service:egress
    networks: !reset []
    depends_on:
      egress:
        condition: service_healthy

volumes:
  network-runtime:
  network-control:
